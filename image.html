<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Viewer</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.2);
      max-width: 900px;
      width: 100%;
      padding: 30px;
      text-align: center;
    }
    .flower-name {
      font-size: 1.6rem;
      color: #333;
      margin-bottom: 20px;
    }
    .image-container {
      margin-bottom: 24px;
    }
    .image-container img {
      max-width: 100%;
      max-height: 60vh;
      object-fit: contain;
      border-radius: 4px;
    }
    .caption-section {
      min-height: 60px;
      padding: 20px;
      background: #f9f9f9;
      border-radius: 4px;
      margin-top: 20px;
    }
    .caption {
      font-size: 1.1rem;
      color: #333;
      line-height: 1.5;
    }
    .error {
      color: #d32f2f;
      font-size: 1rem;
    }
    .loading {
      color: #666;
      font-size: 1rem;
    }
    .back-link {
      display: inline-block;
      margin-top: 20px;
      color: #1976d2;
      text-decoration: none;
      font-size: 1rem;
    }
    .back-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 id="flowerName" class="flower-name"></h1>

    <div class="image-container">
      <img id="displayImage" src="" alt="Loading...">
    </div>

    <div class="caption-section">
      <div id="captionDisplay" class="loading">...</div>
    </div>
    
    <a href="index.html" class="back-link">← Back to Gallery</a>
  </div>

  <script>
    // Which image to show, by filename, looked up in flowers.json
    const urlParams = new URLSearchParams(window.location.search);
    const file = urlParams.get('file');

    const displayImage = document.getElementById('displayImage');
    const flowerName = document.getElementById('flowerName');
    const captionDisplay = document.getElementById('captionDisplay');

    // Resolved once the manifest loads: the absolute URL of this image.
    // The backend fetches the image over HTTP, so it needs a full URL, not a
    // relative path.
    let imageUrl = null;

    async function loadImage() {
      if (!file) {
        flowerName.textContent = 'Image not found';
        captionDisplay.className = 'error';
        captionDisplay.textContent = 'No image was specified.';
        return false;
      }

      let data;
      try {
        const response = await fetch('flowers.json');
        if (!response.ok) throw new Error('HTTP ' + response.status);
        data = await response.json();
      } catch (error) {
        flowerName.textContent = 'Image not found';
        captionDisplay.className = 'error';
        captionDisplay.textContent = 'Could not load the gallery data.';
        return false;
      }

      const imageDir = data.imageDir || 'Images';
      let flower = null;
      for (const color of data.colors) {
        const match = color.flowers.find(f => f.file === file);
        if (match) {
          flower = match;
          break;
        }
      }

      // Only files listed in the manifest are displayed, so a made-up
      // ?file= value can't point the page at something else.
      if (!flower) {
        flowerName.textContent = 'Image not found';
        captionDisplay.className = 'error';
        captionDisplay.textContent = 'That image is not in the gallery.';
        return false;
      }

      imageUrl = new URL(imageDir + '/' + flower.file, window.location.href).href;
      displayImage.src = imageUrl;
      displayImage.alt = flower.alt || flower.name;
      flowerName.textContent = flower.name;
      document.title = flower.name;
      return true;
    }

    // Fetch AI caption from backend
    async function fetchCaption() {
      try {
        const response = await fetch('/api/describe-image', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ imageUrl }),
        });
        
        const data = await response.json();
        
        if (data.error) {
          captionDisplay.className = 'error';
          captionDisplay.textContent = 'Error: ' + data.error;
        } else if (data.caption) {
          captionDisplay.className = 'caption';
          captionDisplay.textContent = data.caption;
        } else {
          captionDisplay.className = 'error';
          captionDisplay.textContent = 'No caption generated.';
        }
      } catch (error) {
        captionDisplay.className = 'error';
        captionDisplay.textContent = 'Failed to connect to AI service.';
      }
    }
    
    // Show the image first, then ask the backend for its caption
    loadImage().then(found => {
      if (found) {
        fetchCaption();
      }
    });
  </script>
</body>
</html>
