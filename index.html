<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photo Gallery</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f4f4f4;
    }
    .page-title {
      max-width: 1200px;
      margin: 0 auto 32px;
      text-align: center;
      font-size: 2rem;
      color: #333;
    }
    .color-section {
      max-width: 1200px;
      margin: 0 auto 48px;
    }
    .color-heading {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 1.5rem;
      color: #333;
      margin-bottom: 16px;
      padding-bottom: 8px;
      border-bottom: 2px solid #ddd;
    }
    .swatch {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      box-shadow: 0 0 0 2px rgba(255,255,255,0.8), 0 1px 3px rgba(0,0,0,0.3);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }
    .card {
      background: white;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      transition: opacity 0.2s, transform 0.2s;
    }
    .card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      display: block;
    }
    .card .title {
      padding: 16px;
      text-align: center;
      font-size: 1.2rem;
      color: #333;
    }
    .card.dimmed {
      opacity: 0.4;
      transform: scale(0.98);
    }
    .card.highlighted {
      box-shadow: 0 0 0 3px #ffd700;
      transform: scale(1.02);
    }
    .status {
      max-width: 1200px;
      margin: 0 auto;
      text-align: center;
      color: #666;
    }
    @media (max-width: 700px) {
      .grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    /* Sidebar styles */
    .page-container {
      display: flex;
      max-width: 1400px;
      margin: 0 auto;
      position: relative;
    }
    /* Docked to the viewport edge, not to .page-container. The container is
       centred with a max-width, so a sidebar inside its flow floats inwards
       on wide screens instead of sitting against the side of the window. */
    #sidebar {
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      width: 320px;
      background: white;
      box-shadow: 2px 0 12px rgba(0,0,0,0.15);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      /* Above .overlay (999), or the backdrop swallows every click meant for
         the ask bar and the feed. */
      z-index: 1001;
    }
    #sidebar.collapsed {
      display: none;
    }
    /* Make room for the panel rather than letting it cover the gallery. */
    body {
      transition: padding-left 0.2s ease;
    }
    body.sidebar-open {
      padding-left: 340px;
    }
    .sidebar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 16px;
      border-bottom: 1px solid #ddd;
      background: #fafafa;
    }
    #sidebarClose {
      flex-shrink: 0;
      width: 32px;
      height: 32px;
      font-size: 1.3rem;
      line-height: 1;
      color: #555;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 4px;
      cursor: pointer;
    }
    #sidebarClose:hover {
      background: #eee;
      border-color: #ccc;
    }
    .sidebar-ask {
      display: flex;
      flex-direction: column;
      gap: 8px;
      /* Flush against the window edge now, so the controls need their own
         breathing room. */
      padding: 16px;
    }
    .sidebar-ask label {
      font-size: 0.9rem;
      font-weight: bold;
      color: #333;
    }
    .sidebar-ask input {
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 0.9rem;
    }
    .sidebar-ask button {
      padding: 10px 16px;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .sidebar-ask button:hover {
      background: #45a049;
    }
    .sidebar-ask button:disabled {
      background: #cccccc;
      cursor: not-allowed;
    }
    .sidebar-notice {
      padding: 12px 16px;
      font-size: 0.85rem;
      color: #666;
      font-style: italic;
      background: #f8f8f8;
      border-bottom: 1px solid #ddd;
    }
    .sidebar-feed {
      flex: 1;
      overflow-y: auto;
      padding: 8px 16px 16px;
    }
    .bouquet-entry {
      background: white;
      border: 1px solid #eee;
      border-radius: 6px;
      padding: 12px;
      margin-bottom: 10px;
      cursor: pointer;
    }
    .bouquet-entry:hover {
      border-color: #ccc;
      background: #f9f9f9;
    }
    .bouquet-entry.active {
      border-color: #4CAF50;
      background: #f0fff0;
    }
    .bouquet-entry .bouquet-name {
      font-weight: bold;
      color: #333;
      margin-bottom: 6px;
      font-size: 1rem;
    }
    .bouquet-entry .bouquet-reason {
      display: none;
      font-size: 0.85rem;
      color: #555;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid #eee;
    }
    .bouquet-entry.expanded .bouquet-reason {
      display: block;
    }
    .bouquet-entry .bouquet-note {
      font-size: 0.8rem;
      color: #884400;
      background: #fff8e1;
      padding: 6px 8px;
      border-radius: 3px;
      margin-top: 8px;
      display: inline-block;
    }
    .bouquet-entry .bouquet-meta {
      font-size: 0.75rem;
      color: #888;
      margin-top: 6px;
    }
    /* Briefly marks the existing entry a reused answer points at, so the
       user can see which one the server matched. */
    .bouquet-entry.flash {
      animation: flash 1.6s ease-out;
    }
    @keyframes flash {
      0%, 100% { border-color: #eee; background: white; }
      20%      { border-color: #1565c0; background: #e3f2fd; }
    }
    @media (prefers-reduced-motion: reduce) {
      .bouquet-entry.flash { animation: none; border-color: #1565c0; }
      .card { transition: none; }
    }
    #sidebarToggle {
      position: fixed;
      top: 20px;
      left: 20px;
      /* Above the sidebar (1001), or opening the panel buries the only
         control that closes it again. */
      z-index: 1002;
      padding: 10px 16px;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.9rem;
    }
    #sidebarToggle:hover {
      background: #45a049;
    }
    /* The open panel carries its own close button, so the floating one would
       only hover over the sidebar it just opened. */
    body.sidebar-open #sidebarToggle {
      display: none;
    }
    #main-content {
      flex: 1;
    }
    .overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.5);
      z-index: 999;
    }
    .overlay.active {
      display: block;
    }
    /* A dimming backdrop belongs to the mobile drawer. Beside a docked
       desktop panel it only greys out the gallery the sidebar points at. */
    @media (min-width: 701px) {
      .overlay.active {
        display: none;
      }
    }
    @media (max-width: 700px) {
      .page-container {
        flex-direction: column;
      }
      #sidebar {
        width: 100%;
        max-width: none;
      }
      /* Full-width drawer over the page: there is no room to shift the
         gallery aside on a phone. */
      body.sidebar-open {
        padding-left: 20px;
      }
      #main-content {
        width: 100%;
      }
      .grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>
<body>
  <button id="sidebarToggle" aria-expanded="false" aria-controls="sidebar">
    Show Bouquet Recommendations
  </button>
  
  <div class="overlay" id="overlay"></div>
  
  <div class="page-container">
    <aside id="sidebar" class="collapsed" aria-label="Bouquet recommendations">
      <div class="sidebar-header">
        <h2 style="margin: 0; font-size: 1.05rem; color: #333;">Bouquet Recommendations</h2>
        <button id="sidebarClose" aria-label="Hide bouquet recommendations">&times;</button>
      </div>
      <div class="sidebar-ask">
        <label for="occasionInput">Ask for an occasion:</label>
        <input type="text" id="occasionInput" placeholder="e.g., flowers for a wedding" maxlength="100">
        <button id="askButton">Get Recommendation</button>
      </div>
      <div id="recommendNotice" class="sidebar-notice" role="status" aria-live="polite" style="display: none;"></div>
      <div class="sidebar-feed" id="bouquetFeed"></div>
    </aside>
    
    <main id="main-content">
      <h1 class="page-title">Flower Gallery</h1>
      <div id="gallery"></div>
      <p id="status" class="status">Loading gallery...</p>
    </main>
  </div>

  <script>
    const gallery = document.getElementById('gallery');
    const status = document.getElementById('status');
    const sidebar = document.getElementById('sidebar');
    const sidebarToggle = document.getElementById('sidebarToggle');
    const sidebarClose = document.getElementById('sidebarClose');
    const overlay = document.getElementById('overlay');
    const bouquetFeed = document.getElementById('bouquetFeed');
    const occasionInput = document.getElementById('occasionInput');
    const askButton = document.getElementById('askButton');
    const recommendNotice = document.getElementById('recommendNotice');

    let allFlowers = [];
    let currentHighlight = null;

    // The feed's source of truth. Reading state back out of the rendered DOM
    // loses whatever the markup doesn't carry, so keep the array itself.
    let bouquets = [];

    // Toggle sidebar
    function toggleSidebar() {
      const opening = sidebar.classList.contains('collapsed');
      sidebar.classList.toggle('collapsed', !opening);
      // Drives the gallery's left padding and hides the floating open button
      // while the panel is showing.
      document.body.classList.toggle('sidebar-open', opening);
      sidebarToggle.setAttribute('aria-expanded', String(opening));
      overlay.classList.toggle('active', opening);

      // Move focus with the panel, so keyboard and screen-reader users are
      // not left on a button that just disappeared.
      if (opening) {
        occasionInput.focus();
      } else {
        sidebarToggle.focus();
      }
    }

    sidebarToggle.addEventListener('click', toggleSidebar);
    sidebarClose.addEventListener('click', toggleSidebar);
    overlay.addEventListener('click', toggleSidebar);

    // Close sidebar on Escape key
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && !sidebar.classList.contains('collapsed')) {
        toggleSidebar();
      }
    });

    // Load gallery
    async function loadGallery() {
      let data;
      try {
        const response = await fetch('flowers.json');
        if (!response.ok) throw new Error('HTTP ' + response.status);
        data = await response.json();
      } catch (error) {
        status.textContent = 'Could not load the gallery.';
        return;
      }

      const imageDir = data.imageDir || 'Images';

      for (const color of data.colors) {
        const section = document.createElement('section');
        section.className = 'color-section';

        const heading = document.createElement('h2');
        heading.className = 'color-heading';
        const swatch = document.createElement('span');
        swatch.className = 'swatch';
        swatch.style.background = color.swatch;
        heading.appendChild(swatch);
        heading.appendChild(document.createTextNode(color.label));
        section.appendChild(heading);

        const grid = document.createElement('div');
        grid.className = 'grid';

        for (const flower of color.flowers) {
          const card = document.createElement('div');
          card.className = 'card';
          card.dataset.file = flower.file;

          const link = document.createElement('a');
          link.href = 'image.html?file=' + encodeURIComponent(flower.file);

          const img = document.createElement('img');
          img.src = imageDir + '/' + flower.file;
          img.alt = flower.alt || flower.name;
          img.loading = 'lazy';
          link.appendChild(img);

          const title = document.createElement('div');
          title.className = 'title';
          title.textContent = flower.name;

          card.appendChild(link);
          card.appendChild(title);
          grid.appendChild(card);

          allFlowers.push({ file: flower.file, name: flower.name, element: card });
        }

        section.appendChild(grid);
        gallery.appendChild(section);
      }

      status.remove();
      loadBouquets();
    }

    // Load bouquets feed
    async function loadBouquets() {
      try {
        const response = await fetch('/api/bouquets');
        if (response.ok) {
          const data = await response.json();
          bouquets = data.bouquets || [];
          renderBouquetFeed(bouquets);
        }
      } catch (error) {
        console.error('Failed to load bouquets:', error);
      }
    }

    // One place that knows how a notice looks. aria-live so a screen reader
    // hears the result of an ask it cannot see.
    function showNotice(message, kind) {
      const palette = {
        info: { color: '#1565c0', background: '#e3f2fd' },
        warn: { color: '#884400', background: '#fff8e1' },
        error: { color: '#d32f2f', background: '#ffebee' },
      };
      const style = palette[kind] || palette.info;
      recommendNotice.textContent = message;
      recommendNotice.style.display = 'block';
      recommendNotice.style.color = style.color;
      recommendNotice.style.background = style.background;
    }

    function hideNotice() {
      recommendNotice.style.display = 'none';
    }

    // Render bouquet feed entries
    function renderBouquetFeed(entries) {
      const bouquets = entries;
      bouquetFeed.innerHTML = '';

      if (bouquets.length === 0) {
        const empty = document.createElement('p');
        empty.textContent = 'No bouquets yet. Ask for a recommendation!';
        empty.style.textAlign = 'center';
        empty.style.color = '#888';
        empty.style.padding = '20px';
        bouquetFeed.appendChild(empty);
        return;
      }

      bouquets.forEach(bouquet => {
        const entry = document.createElement('div');
        entry.className = 'bouquet-entry';
        entry.dataset.id = bouquet.id;
        entry.dataset.flowers = JSON.stringify(bouquet.flowers || []);

        const name = document.createElement('div');
        name.className = 'bouquet-name';
        name.textContent = bouquet.name;
        entry.appendChild(name);

        const reason = document.createElement('div');
        reason.className = 'bouquet-reason';
        reason.textContent = bouquet.reason;
        entry.appendChild(reason);

        if (bouquet.note && bouquet.note.trim()) {
          const note = document.createElement('div');
          note.className = 'bouquet-note';
          note.textContent = bouquet.note;
          entry.appendChild(note);
        }

        const meta = document.createElement('div');
        meta.className = 'bouquet-meta';
        meta.textContent = bouquet.occasion;
        entry.appendChild(meta);

        entry.addEventListener('click', () => toggleBouquetHighlight(bouquet, entry));
        
        bouquetFeed.appendChild(entry);
      });
    }

    // Toggle bouquet highlight in gallery
    function toggleBouquetHighlight(bouquet, entry) {
      const flowers = bouquet.flowers || [];
      
      // If clicking the same bouquet again, clear highlight
      if (currentHighlight && currentHighlight.id === bouquet.id) {
        clearHighlight();
        return;
      }

      // Clear previous highlight
      clearHighlight();

      // Mark all cards as dimmed
      allFlowers.forEach(f => {
        f.element.classList.add('dimmed');
        f.element.classList.remove('highlighted');
      });

      // Highlight the flowers in this bouquet
      const highlightedFiles = new Set(flowers);
      let firstCard = null;
      
      allFlowers.forEach(f => {
        if (highlightedFiles.has(f.file)) {
          f.element.classList.remove('dimmed');
          f.element.classList.add('highlighted');
          if (!firstCard) firstCard = f.element;
        }
      });

      // Expand the clicked bouquet entry to show reason
      entry.classList.add('expanded');

      // Scroll to first highlighted card
      if (firstCard) {
        firstCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }

      currentHighlight = { id: bouquet.id, flowers, entry };
    }

    // Clear all highlights
    function clearHighlight() {
      allFlowers.forEach(f => {
        f.element.classList.remove('dimmed', 'highlighted');
      });
      if (currentHighlight && currentHighlight.entry) {
        currentHighlight.entry.classList.remove('expanded');
      }
      currentHighlight = null;
    }

    // Ask for recommendation
    askButton.addEventListener('click', async () => {
      const question = occasionInput.value.trim();
      if (!question) return;

      askButton.disabled = true;
      askButton.textContent = 'Asking...';
      hideNotice();

      try {
        const response = await fetch('/api/recommend', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question })
        });

        if (response.status === 501) {
          showNotice('Recommendation service is not available yet. Try again later!', 'warn');
        } else if (!response.ok) {
          const data = await response.json().catch(() => ({}));
          showNotice(data.error || 'Failed to get recommendation.', 'error');
        } else {
          const data = await response.json();
          if (data.bouquet) {
            const existing = bouquets.findIndex(b => b.id === data.bouquet.id);

            if (data.reused && existing !== -1) {
              // The server reused an entry already in the feed. Adding it
              // again would put the same bouquet in the list twice, which is
              // precisely what reuse exists to prevent. Point at the one
              // that is already there instead.
              renderBouquetFeed(bouquets);
              const entry = bouquetFeed.children[existing];
              if (entry) {
                entry.scrollIntoView({ behavior: 'smooth', block: 'center' });
                entry.classList.add('flash');
                setTimeout(() => entry.classList.remove('flash'), 1600);
              }
              showNotice('Someone already asked this — showing that bouquet.', 'info');
            } else {
              bouquets.unshift({
                ...data.bouquet,
                id: data.bouquet.id || 'new-' + Date.now()
              });
              renderBouquetFeed(bouquets);
            }
            occasionInput.value = '';
          }
        }
      } catch (error) {
        showNotice('Error: ' + error.message, 'error');
      } finally {
        askButton.disabled = false;
        askButton.textContent = 'Get Recommendation';
      }
    });

    // Allow Enter key to submit
    occasionInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        askButton.click();
      }
    });

    loadGallery();
  </script>
</body>
</html>
