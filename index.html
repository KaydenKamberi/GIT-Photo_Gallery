<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photo Gallery</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f4f4f4;
    }
    .page-title {
      max-width: 1200px;
      margin: 0 auto 32px;
      text-align: center;
      font-size: 2rem;
      color: #333;
    }
    .color-section {
      max-width: 1200px;
      margin: 0 auto 48px;
    }
    .color-heading {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 1.5rem;
      color: #333;
      margin-bottom: 16px;
      padding-bottom: 8px;
      border-bottom: 2px solid #ddd;
    }
    .swatch {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      box-shadow: 0 0 0 2px rgba(255,255,255,0.8), 0 1px 3px rgba(0,0,0,0.3);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }
    .card {
      background: white;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      transition: opacity 0.2s, transform 0.2s;
    }
    .card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      display: block;
    }
    .card .title {
      padding: 16px;
      text-align: center;
      font-size: 1.2rem;
      color: #333;
    }
    .card.dimmed {
      opacity: 0.4;
      transform: scale(0.98);
    }
    .card.highlighted {
      box-shadow: 0 0 0 3px #ffd700;
      transform: scale(1.02);
    }
    .status {
      max-width: 1200px;
      margin: 0 auto;
      text-align: center;
      color: #666;
    }
    @media (max-width: 700px) {
      .grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    /* Sidebar styles */
    .page-container {
      display: flex;
      max-width: 1400px;
      margin: 0 auto;
      position: relative;
    }
    #sidebar {
      width: 320px;
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.15);
      margin-right: 20px;
      flex-shrink: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    #sidebar.collapsed {
      display: none;
    }
    .sidebar-header {
      padding: 16px;
      border-bottom: 1px solid #ddd;
      background: #fafafa;
    }
    .sidebar-ask {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .sidebar-ask label {
      font-size: 0.9rem;
      font-weight: bold;
      color: #333;
    }
    .sidebar-ask input {
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 0.9rem;
    }
    .sidebar-ask button {
      padding: 10px 16px;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .sidebar-ask button:hover {
      background: #45a049;
    }
    .sidebar-ask button:disabled {
      background: #cccccc;
      cursor: not-allowed;
    }
    .sidebar-notice {
      padding: 12px 16px;
      font-size: 0.85rem;
      color: #666;
      font-style: italic;
      background: #f8f8f8;
      border-bottom: 1px solid #ddd;
    }
    .sidebar-feed {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }
    .bouquet-entry {
      background: white;
      border: 1px solid #eee;
      border-radius: 6px;
      padding: 12px;
      margin-bottom: 10px;
      cursor: pointer;
    }
    .bouquet-entry:hover {
      border-color: #ccc;
      background: #f9f9f9;
    }
    .bouquet-entry.active {
      border-color: #4CAF50;
      background: #f0fff0;
    }
    .bouquet-entry .bouquet-name {
      font-weight: bold;
      color: #333;
      margin-bottom: 6px;
      font-size: 1rem;
    }
    .bouquet-entry .bouquet-reason {
      display: none;
      font-size: 0.85rem;
      color: #555;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid #eee;
    }
    .bouquet-entry.expanded .bouquet-reason {
      display: block;
    }
    .bouquet-entry .bouquet-note {
      font-size: 0.8rem;
      color: #884400;
      background: #fff8e1;
      padding: 6px 8px;
      border-radius: 3px;
      margin-top: 8px;
      display: inline-block;
    }
    .bouquet-entry .bouquet-meta {
      font-size: 0.75rem;
      color: #888;
      margin-top: 6px;
    }
    .bouquet-entry.reused .bouquet-name::after {
      content: " (reused)";
      font-weight: normal;
      color: #666;
    }
    #sidebarToggle {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 1000;
      padding: 10px 16px;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.9rem;
    }
    #sidebarToggle:hover {
      background: #45a049;
    }
    #main-content {
      flex: 1;
    }
    .overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.5);
      z-index: 999;
    }
    .overlay.active {
      display: block;
    }
    @media (max-width: 700px) {
      .page-container {
        flex-direction: column;
      }
      #sidebar {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        max-width: none;
        margin: 0;
        border-radius: 0;
        z-index: 1001;
      }
      #sidebar.collapsed {
        display: none;
      }
      #sidebarToggle {
        z-index: 1002;
      }
      #main-content {
        width: 100%;
      }
      .grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>
<body>
  <button id="sidebarToggle" aria-expanded="false" aria-controls="sidebar">
    Show Bouquet Recommendations
  </button>
  
  <div class="overlay" id="overlay"></div>
  
  <div class="page-container">
    <aside id="sidebar" class="collapsed" aria-label="Bouquet recommendations">
      <div class="sidebar-header">
        <h2 style="margin: 0; font-size: 1.2rem; color: #333;">Bouquet Recommendations</h2>
      </div>
      <div class="sidebar-ask">
        <label for="occasionInput">Ask for an occasion:</label>
        <input type="text" id="occasionInput" placeholder="e.g., flowers for a wedding" maxlength="100">
        <button id="askButton">Get Recommendation</button>
      </div>
      <div id="recommendNotice" class="sidebar-notice" style="display: none;"></div>
      <div class="sidebar-feed" id="bouquetFeed"></div>
    </aside>
    
    <main id="main-content">
      <h1 class="page-title">Flower Gallery</h1>
      <div id="gallery"></div>
      <p id="status" class="status">Loading gallery...</p>
    </main>
  </div>

  <script>
    const gallery = document.getElementById('gallery');
    const status = document.getElementById('status');
    const sidebar = document.getElementById('sidebar');
    const sidebarToggle = document.getElementById('sidebarToggle');
    const overlay = document.getElementById('overlay');
    const bouquetFeed = document.getElementById('bouquetFeed');
    const occasionInput = document.getElementById('occasionInput');
    const askButton = document.getElementById('askButton');
    const recommendNotice = document.getElementById('recommendNotice');

    let allFlowers = [];
    let currentHighlight = null;

    // Toggle sidebar
    function toggleSidebar() {
      const isCollapsed = sidebar.classList.contains('collapsed');
      if (isCollapsed) {
        sidebar.classList.remove('collapsed');
        sidebarToggle.setAttribute('aria-expanded', 'true');
        overlay.classList.add('active');
      } else {
        sidebar.classList.add('collapsed');
        sidebarToggle.setAttribute('aria-expanded', 'false');
        overlay.classList.remove('active');
      }
    }

    sidebarToggle.addEventListener('click', toggleSidebar);
    overlay.addEventListener('click', toggleSidebar);

    // Close sidebar on Escape key
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && !sidebar.classList.contains('collapsed')) {
        toggleSidebar();
      }
    });

    // Load gallery
    async function loadGallery() {
      let data;
      try {
        const response = await fetch('flowers.json');
        if (!response.ok) throw new Error('HTTP ' + response.status);
        data = await response.json();
      } catch (error) {
        status.textContent = 'Could not load the gallery.';
        return;
      }

      const imageDir = data.imageDir || 'Images';

      for (const color of data.colors) {
        const section = document.createElement('section');
        section.className = 'color-section';

        const heading = document.createElement('h2');
        heading.className = 'color-heading';
        const swatch = document.createElement('span');
        swatch.className = 'swatch';
        swatch.style.background = color.swatch;
        heading.appendChild(swatch);
        heading.appendChild(document.createTextNode(color.label));
        section.appendChild(heading);

        const grid = document.createElement('div');
        grid.className = 'grid';

        for (const flower of color.flowers) {
          const card = document.createElement('div');
          card.className = 'card';
          card.dataset.file = flower.file;

          const link = document.createElement('a');
          link.href = 'image.html?file=' + encodeURIComponent(flower.file);

          const img = document.createElement('img');
          img.src = imageDir + '/' + flower.file;
          img.alt = flower.alt || flower.name;
          img.loading = 'lazy';
          link.appendChild(img);

          const title = document.createElement('div');
          title.className = 'title';
          title.textContent = flower.name;

          card.appendChild(link);
          card.appendChild(title);
          grid.appendChild(card);

          allFlowers.push({ file: flower.file, name: flower.name, element: card });
        }

        section.appendChild(grid);
        gallery.appendChild(section);
      }

      status.remove();
      loadBouquets();
    }

    // Load bouquets feed
    async function loadBouquets() {
      try {
        const response = await fetch('/api/bouquets');
        if (response.ok) {
          const data = await response.json();
          renderBouquetFeed(data.bouquets || []);
        }
      } catch (error) {
        console.error('Failed to load bouquets:', error);
      }
    }

    // Render bouquet feed entries
    function renderBouquetFeed(bouquets) {
      bouquetFeed.innerHTML = '';
      
      if (bouquets.length === 0) {
        const empty = document.createElement('p');
        empty.textContent = 'No bouquets yet. Ask for a recommendation!';
        empty.style.textAlign = 'center';
        empty.style.color = '#888';
        empty.style.padding = '20px';
        bouquetFeed.appendChild(empty);
        return;
      }

      bouquets.forEach(bouquet => {
        const entry = document.createElement('div');
        entry.className = 'bouquet-entry';
        entry.dataset.id = bouquet.id;
        entry.dataset.flowers = JSON.stringify(bouquet.flowers);
        entry.dataset.reused = bouquet.reused || false;

        if (bouquet.reused) {
          entry.classList.add('reused');
        }

        const name = document.createElement('div');
        name.className = 'bouquet-name';
        name.textContent = bouquet.name;
        entry.appendChild(name);

        const reason = document.createElement('div');
        reason.className = 'bouquet-reason';
        reason.textContent = bouquet.reason;
        entry.appendChild(reason);

        if (bouquet.note && bouquet.note.trim()) {
          const note = document.createElement('div');
          note.className = 'bouquet-note';
          note.textContent = bouquet.note;
          entry.appendChild(note);
        }

        const meta = document.createElement('div');
        meta.className = 'bouquet-meta';
        meta.textContent = bouquet.occasion;
        entry.appendChild(meta);

        entry.addEventListener('click', () => toggleBouquetHighlight(bouquet, entry));
        
        bouquetFeed.appendChild(entry);
      });
    }

    // Toggle bouquet highlight in gallery
    function toggleBouquetHighlight(bouquet, entry) {
      const flowers = bouquet.flowers || [];
      
      // If clicking the same bouquet again, clear highlight
      if (currentHighlight && currentHighlight.id === bouquet.id) {
        clearHighlight();
        return;
      }

      // Clear previous highlight
      clearHighlight();

      // Mark all cards as dimmed
      allFlowers.forEach(f => {
        f.element.classList.add('dimmed');
        f.element.classList.remove('highlighted');
      });

      // Highlight the flowers in this bouquet
      const highlightedFiles = new Set(flowers);
      let firstCard = null;
      
      allFlowers.forEach(f => {
        if (highlightedFiles.has(f.file)) {
          f.element.classList.remove('dimmed');
          f.element.classList.add('highlighted');
          if (!firstCard) firstCard = f.element;
        }
      });

      // Expand the clicked bouquet entry to show reason
      entry.classList.add('expanded');

      // Scroll to first highlighted card
      if (firstCard) {
        firstCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }

      currentHighlight = { id: bouquet.id, flowers, entry };
    }

    // Clear all highlights
    function clearHighlight() {
      allFlowers.forEach(f => {
        f.element.classList.remove('dimmed', 'highlighted');
      });
      if (currentHighlight && currentHighlight.entry) {
        currentHighlight.entry.classList.remove('expanded');
      }
      currentHighlight = null;
    }

    // Ask for recommendation
    askButton.addEventListener('click', async () => {
      const question = occasionInput.value.trim();
      if (!question) return;

      askButton.disabled = true;
      askButton.textContent = 'Asking...';
      recommendNotice.style.display = 'none';

      try {
        const response = await fetch('/api/recommend', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question })
        });

        if (response.status === 501) {
          recommendNotice.textContent = 'Recommendation service is not available yet. Try again later!';
          recommendNotice.style.display = 'block';
          recommendNotice.style.color = '#884400';
          recommendNotice.style.background = '#fff8e1';
        } else if (!response.ok) {
          const data = await response.json();
          recommendNotice.textContent = data.error || 'Failed to get recommendation.';
          recommendNotice.style.display = 'block';
          recommendNotice.style.color = '#d32f2f';
          recommendNotice.style.background = '#ffebee';
        } else {
          const data = await response.json();
          if (data.bouquet) {
            // Add the new bouquet to the top of the feed
            const bouquets = Array.from(bouquetFeed.children).map(el => {
              return {
                id: el.dataset.id,
                name: el.querySelector('.bouquet-name').textContent,
                occasion: el.querySelector('.bouquet-meta')?.textContent || '',
                flowers: JSON.parse(el.dataset.flowers),
                reason: el.querySelector('.bouquet-reason')?.textContent || '',
                note: el.querySelector('.bouquet-note')?.textContent || '',
                reused: el.dataset.reused === 'true'
              };
            });
            bouquets.unshift({
              ...data.bouquet,
              reused: data.reused,
              id: data.bouquet.id || 'new-' + Date.now()
            });
            renderBouquetFeed(bouquets);
            occasionInput.value = '';
          }
        }
      } catch (error) {
        recommendNotice.textContent = 'Error: ' + error.message;
        recommendNotice.style.display = 'block';
        recommendNotice.style.color = '#d32f2f';
        recommendNotice.style.background = '#ffebee';
      } finally {
        askButton.disabled = false;
        askButton.textContent = 'Get Recommendation';
      }
    });

    // Allow Enter key to submit
    occasionInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        askButton.click();
      }
    });

    loadGallery();
  </script>
</body>
</html>
