<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photo Gallery</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f4f4f4;
    }
    .page-title {
      max-width: 1200px;
      margin: 0 auto 32px;
      text-align: center;
      font-size: 2rem;
      color: #333;
    }
    .color-section {
      max-width: 1200px;
      margin: 0 auto 48px;
    }
    .color-heading {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 1.5rem;
      color: #333;
      margin-bottom: 16px;
      padding-bottom: 8px;
      border-bottom: 2px solid #ddd;
    }
    .swatch {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      box-shadow: 0 0 0 2px rgba(255,255,255,0.8), 0 1px 3px rgba(0,0,0,0.3);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }
    .card {
      background: white;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      display: block;
    }
    .card .title {
      padding: 16px;
      text-align: center;
      font-size: 1.2rem;
      color: #333;
    }
    .status {
      max-width: 1200px;
      margin: 0 auto;
      text-align: center;
      color: #666;
    }
    @media (max-width: 700px) {
      .grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>
<body>
  <h1 class="page-title">Flower Gallery</h1>
  <div id="gallery"></div>
  <p id="status" class="status">Loading gallery…</p>

  <script>
    const gallery = document.getElementById('gallery');
    const status = document.getElementById('status');

    async function loadGallery() {
      let data;
      try {
        const response = await fetch('flowers.json');
        if (!response.ok) throw new Error('HTTP ' + response.status);
        data = await response.json();
      } catch (error) {
        status.textContent = 'Could not load the gallery.';
        return;
      }

      const imageDir = data.imageDir || 'Images';

      for (const color of data.colors) {
        const section = document.createElement('section');
        section.className = 'color-section';

        const heading = document.createElement('h2');
        heading.className = 'color-heading';
        const swatch = document.createElement('span');
        swatch.className = 'swatch';
        swatch.style.background = color.swatch;
        heading.appendChild(swatch);
        heading.appendChild(document.createTextNode(color.label));
        section.appendChild(heading);

        const grid = document.createElement('div');
        grid.className = 'grid';

        for (const flower of color.flowers) {
          const card = document.createElement('div');
          card.className = 'card';

          const link = document.createElement('a');
          link.href = 'image.html?file=' + encodeURIComponent(flower.file);

          const img = document.createElement('img');
          img.src = imageDir + '/' + flower.file;
          img.alt = flower.alt || flower.name;
          img.loading = 'lazy';
          link.appendChild(img);

          const title = document.createElement('div');
          title.className = 'title';
          title.textContent = flower.name;

          card.appendChild(link);
          card.appendChild(title);
          grid.appendChild(card);
        }

        section.appendChild(grid);
        gallery.appendChild(section);
      }

      status.remove();
    }

    loadGallery();
  </script>
</body>
</html>
